  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }
    html, body {
      margin: 0 !important;
      padding: 0 !important;
      width: 100% !important;
      height: 100% !important;
      max-width: 100vw !important;
      max-height: 100vh !important;
      overflow: hidden !important;
      position: fixed !important;
      inset: 0 !important;
      overscroll-behavior: none !important;
      touch-action: none !important;
      background-color: #F8FAFC;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    #app-splash {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #F8FAFC;
      z-index: 999999;
      overflow: hidden;
      touch-action: none;
      user-select: none;
      opacity: 1;
      transition: opacity 0.32s cubic-bezier(0.22, 1, 0.36, 1);
    }

    #app-splash.splash-hide {
      opacity: 0;
      pointer-events: none;
    }

    .splash-stage {
      position: relative;
      width: 280px;
      height: 220px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 1. Logo: starts centered alone, glides right to reveal letters, then rises smoothly above title */
    .splash-logo-Mover {
      position: absolute;
      width: 78px;
      height: 78px;
      will-change: transform;
      animation: logoTrajectory 1.35s forwards;
      z-index: 2;
    }

    .splash-logo {
      width: 78px;
      height: 78px;
      border-radius: 22px;
      background: #FFFFFF;
      border: 1.2px solid #E2E8F0;
      box-shadow: 0 10px 24px rgba(15, 23, 42, 0.08);
      object-fit: cover;
      display: block;
    }

    /* 2. Wordmark ("BizFlow"): letters reveal left-to-right as logo moves right, then centers below logo */
    .splash-wordmark {
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 27px;
      font-weight: 800;
      letter-spacing: -0.7px;
      color: #0F172A;
      will-change: transform;
      animation: wordmarkTrajectory 1.35s forwards;
      z-index: 1;
    }

    .splash-char {
      display: inline-block;
      opacity: 0;
      transform: translate3d(-6px, 5px, 0) scale(0.86);
      will-change: transform, opacity;
      animation: charReveal 0.28s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .splash-char:nth-child(1) { animation-delay: 0.18s; }
    .splash-char:nth-child(2) { animation-delay: 0.23s; }
    .splash-char:nth-child(3) { animation-delay: 0.28s; }
    .splash-char:nth-child(4) { animation-delay: 0.33s; }
    .splash-char:nth-child(5) { animation-delay: 0.38s; }
    .splash-char:nth-child(6) { animation-delay: 0.43s; }
    .splash-char:nth-child(7) { animation-delay: 0.48s; }

    /* 3. Loading bar directly underneath "BizFlow" */
    .splash-loader {
      position: absolute;
      transform: translate3d(0, 58px, 0);
      width: 54px;
      height: 3.5px;
      border-radius: 3px;
      background: #E2E8F0;
      overflow: hidden;
      opacity: 0;
      will-change: opacity;
      animation: loaderAppear 0.3s ease-out 1.18s forwards;
    }

    .splash-loader-bar {
      width: 55%;
      height: 100%;
      border-radius: 3px;
      background: #0F766E;
      will-change: transform;
      animation: loaderSlide 1.05s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    /* Continuous 3-phase trajectory without any mid-lift pause keyframe:
       0% -> 12%: Crisp entrance at center (0, 0)
       12% -> 48%: Glides right to (+68px, 0) while letters appear
       48% -> 100%: Single uninterrupted sweep to (0, -52px) above "BizFlow" */
    @keyframes logoTrajectory {
      0% {
        transform: translate3d(0px, 0px, 0) scale(0.88);
        animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1);
      }
      12% {
        transform: translate3d(0px, 0px, 0) scale(1);
        animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
      }
      48% {
        transform: translate3d(68px, 0px, 0) scale(1);
        animation-timing-function: cubic-bezier(0.42, 0, 0.18, 1);
      }
      100% {
        transform: translate3d(0px, -52px, 0) scale(1);
      }
    }

    @keyframes wordmarkTrajectory {
      0%, 48% {
        transform: translate3d(-38px, 0px, 0);
        animation-timing-function: cubic-bezier(0.42, 0, 0.18, 1);
      }
      100% {
        transform: translate3d(0px, 22px, 0);
      }
    }

    @keyframes charReveal {
      0% {
        opacity: 0;
        transform: translate3d(-6px, 5px, 0) scale(0.86);
      }
      100% {
        opacity: 1;
        transform: translate3d(0px, 0px, 0) scale(1);
      }
    }

    @keyframes loaderAppear {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }

    @keyframes loaderSlide {
      0% { transform: translate3d(-110%, 0, 0); }
      100% { transform: translate3d(210%, 0, 0); }
    }
  </style>

  <script>
    (function () {
      var animDone = false;
      var flutterReady = false;
      var dismissed = false;

      function tryDismiss() {
        if (dismissed || !animDone || !flutterReady) return;
        dismissed = true;
        var el = document.getElementById('app-splash');
        if (el) {
          el.classList.add('splash-hide');
          setTimeout(function () {
            if (el.parentNode) el.parentNode.removeChild(el);
          }, 340);
        }
      }

      // Allow full logo -> letters -> move above -> loader animation to play (1.5s)
      setTimeout(function () {
        animDone = true;
        tryDismiss();
      }, 1500);

      window.addEventListener('flutter-first-frame', function () {
        flutterReady = true;
        tryDismiss();
      });
    })();
  </script>
